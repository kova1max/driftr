name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck bin/driftr

  test:
    name: test (${{ matrix.os }}, ${{ matrix.bash }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          - os: macos-latest
            bash: bash
          # the bash 3.2 macOS ships, which `#!/usr/bin/env bash` can resolve to
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
        env:
          DRIFTR_BASH: ${{ matrix.bash }}
